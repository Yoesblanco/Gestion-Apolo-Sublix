services:
  postgres:
    image: postgres:16-alpine
    container_name: apolo_sublix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-apolo_sublix}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apolo_sublix"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: apolo_sublix_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-apolo_sublix}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_2026_sublix}
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"

volumes:
  postgres_data:
    driver: local
